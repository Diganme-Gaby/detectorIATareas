<main class="pagina pagina-angosta">
  <span class="etiqueta">Bienvenido de nuevo</span>
  <h1 class="titulo-grande">Inicia sesión</h1>

  <form class="formulario" #formulario="ngForm" (ngSubmit)="iniciarSesion()">
    <div class="campo">
      <label for="username">Usuario</label>
      <input
        id="username"
        name="username"
        [(ngModel)]="datos.username"
        required
        autocomplete="username"
      />
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <div class="campo-clave">
        <input
          id="password"
          name="password"
          [type]="verPassword() ? 'text' : 'password'"
          [(ngModel)]="datos.password"
          required
          autocomplete="current-password"
        />
        <app-verclavecomponent [(visible)]="verPassword" />
      </div>
    </div>

    @if (sinVerificar()) {
      <p class="aviso">
        Tu cuenta aún no está confirmada.
        <a routerLink="/verificar-correo">Reenviar el correo de confirmación</a>
      </p>
    }

    <div class="grupo-botones">
      <button type="submit" class="boton" [disabled]="formulario.invalid || cargando()">
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
      <a routerLink="/recuperar-contrasena" class="fantasma">Olvidé mi contraseña</a>
    </div>
  </form>

  <p class="pie-formulario texto-ceniza">
    ¿No tienes cuenta? <a routerLink="/registro">Créala aquí</a>
  </p>
</main>

<button
  type="button"
  class="ver-clave"
  (click)="alternar()"
  [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
  [attr.aria-pressed]="visible()"
  [title]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
>
  @if (visible()) {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 3l18 18" />
      <path d="M10.6 5.1A9.9 9.9 0 0 1 12 5c5 0 8.7 4.4 10 7-.6 1.2-1.6 2.6-2.9 3.9" />
      <path d="M6.6 6.6C4.4 8 2.8 10.1 2 12c1.3 2.6 5 7 10 7 1.9 0 3.6-.6 5-1.5" />
      <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M2 12c1.3-2.6 5-7 10-7s8.7 4.4 10 7c-1.3 2.6-5 7-10 7S3.3 14.6 2 12z" />
      <circle cx="12" cy="12" r="3" />
    </svg>
  }
</button>
